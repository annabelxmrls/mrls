<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morales Family Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="wordmark">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>
      <span id="brand">Morales Family Videos</span>
    </div>
    <nav class="nav" id="nav"></nav>
    
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="stage" id="stage">
    <header class="topbar">
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Open menu">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="back" id="backBtn" aria-label="Go back" hidden>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </button>
      <div class="head">
        <h1 id="pageTitle"></h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <button class="iconbtn" id="searchBtn" aria-label="Search videos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" aria-label="Switch appearance">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="searchwrap" id="searchWrap">
      <input id="searchInput" type="search" placeholder="Search by title, year, or note" autocomplete="off">
    </div>

    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>


<!-- Your videos live in js/library.js - that is the only file you need to edit to add a memory. -->
<script src="js/library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
